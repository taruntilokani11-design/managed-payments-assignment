<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Llama — Subscribe</title>
    <style>
      :root {
        --ink: #1b1530;
        --muted: #6b6180;
        --bg: #faf8fc;
        --card: #ffffff;
        --accent: #6d4bff;
        --accent-dark: #5836e0;
        --border: #ece7f7;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: var(--ink);
        padding: 1.5rem;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: 0 20px 40px -24px rgba(27, 21, 48, 0.25);
        padding: 2.75rem 2.5rem;
        max-width: 26rem;
        width: 100%;
        text-align: center;
      }
      .brand {
        font-size: 2rem;
        margin-bottom: 0.75rem;
      }
      h1 {
        font-size: 1.4rem;
        margin: 0 0 0.4rem;
      }
      .price {
        font-size: 2.25rem;
        font-weight: 700;
        margin: 1.25rem 0 0.25rem;
      }
      .price span {
        font-size: 1rem;
        font-weight: 500;
        color: var(--muted);
      }
      p.tagline {
        color: var(--muted);
        margin: 0 0 1.75rem;
        font-size: 0.95rem;
      }
      ul.perks {
        list-style: none;
        padding: 0;
        margin: 0 0 2rem;
        text-align: left;
        color: var(--muted);
        font-size: 0.9rem;
        display: grid;
        gap: 0.5rem;
      }
      ul.perks li::before {
        content: "✓";
        color: var(--accent);
        font-weight: 700;
        margin-right: 0.5rem;
      }
      button {
        width: 100%;
        font-size: 1rem;
        font-weight: 600;
        padding: 0.9rem 1.5rem;
        border: none;
        border-radius: 12px;
        background: var(--accent);
        color: white;
        cursor: pointer;
        transition: background 0.15s ease, transform 0.15s ease;
      }
      button:hover { background: var(--accent-dark); }
      button:active { transform: scale(0.98); }
      .footnote {
        margin-top: 1.25rem;
        font-size: 0.78rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">🦙</div>
      <h1>Llama Plus</h1>
      <p class="tagline">Your AI travel planner, unlocked.</p>
      <div class="price">$10<span> / month</span></div>
      <ul class="perks">
        <li>Unlimited itinerary planning</li>
        <li>Real-time price tracking</li>
        <li>Priority trip support</li>
      </ul>
      <form action="/create-checkout-session" method="POST">
        <button type="submit">Subscribe</button>
      </form>
      <p class="footnote">Secure checkout powered by Stripe. Cancel anytime.</p>
    </div>
  </body>
</html>

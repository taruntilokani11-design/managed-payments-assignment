<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Llama — Subscribed!</title>
    <style>
      :root {
        --ink: #1b1530;
        --muted: #6b6180;
        --bg: #faf8fc;
        --card: #ffffff;
        --accent: #6d4bff;
        --border: #ece7f7;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: var(--ink);
        padding: 1.5rem;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: 0 20px 40px -24px rgba(27, 21, 48, 0.25);
        padding: 2.75rem 2.5rem;
        max-width: 26rem;
        width: 100%;
        text-align: center;
      }
      .badge {
        font-size: 2.5rem;
        margin-bottom: 0.75rem;
      }
      h1 { font-size: 1.4rem; margin: 0 0 0.6rem; }
      p { color: var(--muted); margin: 0; font-size: 0.95rem; line-height: 1.5; }
      a { color: var(--accent); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">🎉</div>
      <h1>Thanks for subscribing to Llama Plus!</h1>
      <p>
        We appreciate your business! If you have any questions, email us at
        <a href="mailto:orders@example.com">orders@example.com</a>.
      </p>
    </div>
  </body>
</html>
